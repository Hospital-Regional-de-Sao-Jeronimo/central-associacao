name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: 🧪 Build & Check Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Check Frontend Types
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

      - name: Check Backend Types
        run: |
          cd backend
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm exec tsc --noEmit

  deploy:
    name: 🚀 Automatic Deploy to Production Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd ~/Desenvolvimento/central-associacao 2>/dev/null || cd /home/mateus/Desenvolvimento/central-associacao 2>/dev/null || cd ~/central-associacao
            ./deploy.sh
